<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Futuristic Energy Reactor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #252a35;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #9da5b4;
      margin-top: 6px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .viewer {
      width: min(1100px, 95vw);
      height: 650px;
      background: #10151f;
      border: 1px solid #303746;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 14px 18px;
      background: rgba(8, 11, 18, 0.8);
      border: 1px solid #303746;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .info span {
      color: #9da5b4;
      font-size: 14px;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9da5b4;
      font-size: 16px;
      pointer-events: none;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #ff6b6b;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      header {
        padding: 20px;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        padding: 15px;
      }

      .viewer {
        height: 600px;
        width: 95vw;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚛️ AURA — Futuristic Energy Reactor</h1>
    <p>Interactive 3D Energy Reactor</p>
  </header>

  <main>
    <div class="viewer" id="viewer">

      <div class="loading" id="loading">
        Loading AURA Reactor...
      </div>

      <div class="error" id="error">
        Unable to load the 3D model.
      </div>

      <div class="info">
        <strong>AURA Reactor</strong><br>
        <span>Drag to rotate • Scroll to zoom</span>
      </div>

    </div>
  </main>


  <!--
    IMPORTANT:
    Import map fixes the "Failed to resolve module specifier 'three'"
    error when using Three.js modules directly in the browser.
  -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "three";

    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";


    // --------------------------------------------------
    // Container
    // --------------------------------------------------

    const container = document.getElementById("viewer");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("error");


    // --------------------------------------------------
    // Scene
    // --------------------------------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x080b12);


    // --------------------------------------------------
    // Camera
    // --------------------------------------------------

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 6);


    // --------------------------------------------------
    // Renderer
    // --------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

    container.appendChild(renderer.domElement);


    // --------------------------------------------------
    // Lights
    // --------------------------------------------------

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      2
    );

    scene.add(ambientLight);


    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    keyLight.position.set(4, 6, 5);

    scene.add(keyLight);


    const fillLight = new THREE.PointLight(
      0x66ccff,
      20,
      20
    );

    fillLight.position.set(-3, 3, 4);

    scene.add(fillLight);


    // --------------------------------------------------
    // Orbit Controls
    // --------------------------------------------------

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.minDistance = 2;

    controls.maxDistance = 15;

    controls.target.set(0, 0, 0);


    // --------------------------------------------------
    // GLTF Loader
    // --------------------------------------------------

    const loader = new GLTFLoader();


    loader.load(

      "./AURA_Reactor_updated.glb",

      // ------------------------------------------------
      // SUCCESS
      // ------------------------------------------------

      (gltf) => {

        console.log("AURA GLB loaded successfully.");

        const model = gltf.scene;

        scene.add(model);


        // ----------------------------------------------
        // Calculate bounding box
        // ----------------------------------------------

        const box = new THREE.Box3().setFromObject(model);

        const center = box.getCenter(
          new THREE.Vector3()
        );

        const size = box.getSize(
          new THREE.Vector3()
        );


        // ----------------------------------------------
        // Center model
        // ----------------------------------------------

        model.position.sub(center);


        // ----------------------------------------------
        // Scale model
        // ----------------------------------------------

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );


        if (maxDimension > 0) {

          const scale = 4 / maxDimension;

          model.scale.setScalar(scale);

        }


        // ----------------------------------------------
        // Play ALL animations
        // ----------------------------------------------

        if (gltf.animations.length > 0) {

          console.log(
            `Found ${gltf.animations.length} animations.`
          );

          const mixer = new THREE.AnimationMixer(model);

          gltf.animations.forEach((clip) => {

            console.log(
              "Playing animation:",
              clip.name
            );

            const action = mixer.clipAction(clip);

            action.play();

          });

          model.userData.mixer = mixer;

        } else {

          console.log("No animations found in GLB.");

        }


        // ----------------------------------------------
        // Store model
        // ----------------------------------------------

        scene.userData.model = model;


        // ----------------------------------------------
        // Camera
        // ----------------------------------------------

        camera.position.set(
          0,
          1.5,
          6
        );

        controls.target.set(
          0,
          0,
          0
        );

        controls.update();


        // ----------------------------------------------
        // Hide loading
        // ----------------------------------------------

        loading.style.display = "none";

      },


      // ------------------------------------------------
      // PROGRESS
      // ------------------------------------------------

      (progress) => {

        if (progress.total) {

          const percent =
            (progress.loaded / progress.total) * 100;

          loading.textContent =
            `Loading AURA Reactor... ${percent.toFixed(0)}%`;

        }

      },


      // ------------------------------------------------
      // ERROR
      // ------------------------------------------------

      (error) => {

        console.error(
          "GLB loading error:",
          error
        );

        loading.style.display = "none";

        errorMessage.style.display = "flex";

        errorMessage.innerHTML = `
          <div>
            <strong>Failed to load AURA Reactor</strong>
            <br><br>
            Check the browser console for details.
          </div>
        `;

      }

    );


    // --------------------------------------------------
    // Animation Loop
    // --------------------------------------------------

    const clock = new THREE.Clock();


    function animate() {

      requestAnimationFrame(animate);


      const delta = clock.getDelta();


      const model = scene.userData.model;


      if (
        model &&
        model.userData.mixer
      ) {

        model.userData.mixer.update(delta);

      }


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // --------------------------------------------------
    // Responsive
    // --------------------------------------------------

    window.addEventListener(
      "resize",
      () => {

        const width =
          container.clientWidth;

        const height =
          container.clientHeight;


        camera.aspect =
          width / height;

        camera.updateProjectionMatrix();


        renderer.setSize(
          width,
          height
        );

      }
    );

  </script>

</body>
</html>

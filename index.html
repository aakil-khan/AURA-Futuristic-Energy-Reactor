<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Futuristic Energy Reactor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #252a35;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #9da5b4;
      margin-top: 6px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .viewer {
      width: min(1100px, 95vw);
      height: 650px;
      background: #10151f;
      border: 1px solid #303746;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 14px 18px;
      background: rgba(8, 11, 18, 0.8);
      border: 1px solid #303746;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .info span {
      color: #9da5b4;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚛️ AURA — Futuristic Energy Reactor</h1>
  <p>Interactive 3D Energy Reactor</p>
</header>

<main>
  <div class="viewer" id="viewer">
    <div class="info">
      <strong>AURA Reactor</strong><br>
      <span>Drag to rotate • Scroll to zoom</span>
    </div>
  </div>
</main>

<script type="module">
  import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

  import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

  import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

  const container = document.getElementById("viewer");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080b12);

  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
  );

  camera.position.set(0, 2, 6);

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  container.appendChild(renderer.domElement);

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 2);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 3);
  keyLight.position.set(4, 6, 5);
  scene.add(keyLight);

  const fillLight = new THREE.PointLight(0x66ccff, 20, 20);
  fillLight.position.set(-3, 3, 4);
  scene.add(fillLight);

  // Controls
  const controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;
  controls.minDistance = 2;
  controls.maxDistance = 15;

  // Load AURA GLB
  const loader = new GLTFLoader();

  loader.load(
    "./AURA_Reactor_updated.glb",

    (gltf) => {

      const model = gltf.scene;

      scene.add(model);

      // Center model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());

      model.position.sub(center);

      // Scale automatically
      const size = box.getSize(new THREE.Vector3());
      const maxDimension =
        Math.max(size.x, size.y, size.z);

      const scale = 4 / maxDimension;

      model.scale.setScalar(scale);

      // Play ALL animations
      if (gltf.animations.length > 0) {

        const mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach((clip) => {
          mixer.clipAction(clip).play();
        });

        model.userData.mixer = mixer;
      }

      // Store model
      scene.userData.model = model;

      // Adjust camera
      camera.position.set(0, 1.5, 6);
      controls.target.set(0, 0, 0);
      controls.update();

    },

    undefined,

    (error) => {
      console.error("GLB loading error:", error);
    }
  );

  const clock = new THREE.Clock();

  function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    const model = scene.userData.model;

    if (model && model.userData.mixer) {
      model.userData.mixer.update(delta);
    }

    controls.update();

    renderer.render(scene, camera);
  }

  animate();

  // Responsive
  window.addEventListener("resize", () => {

    camera.aspect =
      container.clientWidth /
      container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );
  });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA — Futuristic Energy Reactor</title>

  <!-- IMPORTANT: Resolve "three" imports used by Three.js addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #252a35;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #9da5b4;
      margin-top: 6px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .viewer {
      width: min(1100px, 95vw);
      height: 650px;
      background: #10151f;
      border: 1px solid #303746;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 14px 18px;
      background: rgba(8, 11, 18, 0.85);
      border: 1px solid #303746;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .info strong {
      font-size: 14px;
    }

    .info span {
      color: #9da5b4;
      font-size: 14px;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9da5b4;
      font-size: 16px;
      z-index: 5;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #ff6b6b;
      text-align: center;
      padding: 30px;
      z-index: 20;
    }

    .error small {
      color: #9da5b4;
    }

    @media (max-width: 768px) {
      header {
        padding: 20px;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        padding: 15px;
      }

      .viewer {
        width: 100%;
        height: 500px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚛️ AURA — Futuristic Energy Reactor</h1>
  <p>Interactive 3D Energy Reactor</p>
</header>

<main>

  <div class="viewer" id="viewer">

    <div class="loading" id="loading">
      Loading AURA Reactor...
    </div>

    <div class="error" id="error">
      <strong>Unable to load AURA Reactor</strong>
      <small id="errorText">
        Please check the GLB file.
      </small>
    </div>

    <div class="info">
      <strong>AURA Reactor</strong><br>
      <span>Drag to rotate • Scroll to zoom</span>
    </div>

  </div>

</main>

<script type="module">

  // =====================================================
  // THREE.JS
  // =====================================================

  import * as THREE from "three";

  import {
    OrbitControls
  } from "three/addons/controls/OrbitControls.js";

  import {
    GLTFLoader
  } from "three/addons/loaders/GLTFLoader.js";


  // =====================================================
  // ELEMENTS
  // =====================================================

  const container = document.getElementById("viewer");

  const loading = document.getElementById("loading");

  const errorBox = document.getElementById("error");

  const errorText = document.getElementById("errorText");


  // =====================================================
  // SCENE
  // =====================================================

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0x080b12);


  // =====================================================
  // CAMERA
  // =====================================================

  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.01,
    1000
  );

  camera.position.set(0, 1.5, 6);


  // =====================================================
  // RENDERER
  // =====================================================

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  renderer.outputColorSpace = THREE.SRGBColorSpace;

  container.appendChild(renderer.domElement);


  // =====================================================
  // LIGHTING
  // =====================================================

  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    2
  );

  scene.add(ambientLight);


  const keyLight = new THREE.DirectionalLight(
    0xffffff,
    3
  );

  keyLight.position.set(
    4,
    6,
    5
  );

  scene.add(keyLight);


  const fillLight = new THREE.PointLight(
    0x66ccff,
    20,
    20
  );

  fillLight.position.set(
    -3,
    3,
    4
  );

  scene.add(fillLight);


  const rimLight = new THREE.PointLight(
    0x00ffff,
    15,
    15
  );

  rimLight.position.set(
    3,
    2,
    -4
  );

  scene.add(rimLight);


  // =====================================================
  // ORBIT CONTROLS
  // =====================================================

  const controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  controls.dampingFactor = 0.05;

  controls.minDistance = 1;

  controls.maxDistance = 20;

  controls.enablePan = false;


  // =====================================================
  // GLTF LOADER
  // =====================================================

  const loader = new GLTFLoader();


  const modelPath = "./AURA_Reactor_Final.glb";


  loader.load(

    modelPath,

    // ===================================================
    // SUCCESS
    // ===================================================

    (gltf) => {

      console.log("AURA GLB loaded successfully");

      const model = gltf.scene;

      scene.add(model);


      // -------------------------------------------------
      // CALCULATE BOUNDING BOX
      // -------------------------------------------------

      const box = new THREE.Box3()
        .setFromObject(model);


      const center = box.getCenter(
        new THREE.Vector3()
      );


      const size = box.getSize(
        new THREE.Vector3()
      );


      // -------------------------------------------------
      // CENTER MODEL
      // -------------------------------------------------

      model.position.x -= center.x;

      model.position.y -= center.y;

      model.position.z -= center.z;


      // -------------------------------------------------
      // SCALE MODEL
      // -------------------------------------------------

      const maxDimension = Math.max(
        size.x,
        size.y,
        size.z
      );


      if (maxDimension > 0) {

        const scale =
          4 / maxDimension;

        model.scale.setScalar(scale);

      }


      // -------------------------------------------------
      // ENABLE SHADOWS
      // -------------------------------------------------

      model.traverse((object) => {

        if (object.isMesh) {

          object.castShadow = true;

          object.receiveShadow = true;

        }

      });


      // -------------------------------------------------
      // ANIMATIONS
      // -------------------------------------------------

      if (gltf.animations.length > 0) {

        const mixer =
          new THREE.AnimationMixer(model);


        gltf.animations.forEach((clip) => {

          const action =
            mixer.clipAction(clip);

          action.play();

        });


        model.userData.mixer = mixer;

      }


      // -------------------------------------------------
      // SAVE MODEL
      // -------------------------------------------------

      scene.userData.model = model;


      // -------------------------------------------------
      // CAMERA
      // -------------------------------------------------

      camera.position.set(
        0,
        1.5,
        6
      );


      controls.target.set(
        0,
        0,
        0
      );


      controls.update();


      // -------------------------------------------------
      // HIDE LOADING
      // -------------------------------------------------

      loading.style.display = "none";


      console.log(
        "Model animations:",
        gltf.animations.length
      );

    },


    // ===================================================
    // PROGRESS
    // ===================================================

    (progress) => {

      if (progress.total > 0) {

        const percent =
          (progress.loaded /
          progress.total) * 100;

        loading.textContent =
          `Loading AURA Reactor... ${Math.round(percent)}%`;

      } else {

        loading.textContent =
          "Loading AURA Reactor...";

      }

    },


    // ===================================================
    // ERROR
    // ===================================================

    (error) => {

      console.error(
        "AURA GLB loading error:",
        error
      );


      loading.style.display = "none";

      errorBox.style.display = "flex";

      errorText.textContent =
        "Could not load AURA_Reactor_updated.glb";

    }

  );


  // =====================================================
  // CLOCK
  // =====================================================

  const clock = new THREE.Clock();


  // =====================================================
  // ANIMATION LOOP
  // =====================================================

  function animate() {

    requestAnimationFrame(animate);


    const delta =
      clock.getDelta();


    const model =
      scene.userData.model;


    if (
      model &&
      model.userData.mixer
    ) {

      model.userData.mixer.update(
        delta
      );

    }


    controls.update();


    renderer.render(
      scene,
      camera
    );

  }


  animate();


  // =====================================================
  // RESPONSIVE
  // =====================================================

  window.addEventListener(
    "resize",
    () => {

      const width =
        container.clientWidth;

      const height =
        container.clientHeight;


      camera.aspect =
        width / height;


      camera.updateProjectionMatrix();


      renderer.setSize(
        width,
        height
      );

    }
  );

</script>

</body>
</html>
